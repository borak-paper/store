<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Print Sheet Maker</title>
<style id="pageStyle">@page{size:A4 landscape;margin:0}</style>
<style>
:root{--bg:#eef0f3;--panel:#fff;--ink:#1c2430;--mute:#667085;--line:#d9dde3;--acc:#1f5eff;--accink:#fff;--field:#f6f7f9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--panel:#1d2128;--ink:#e8ebf0;--mute:#98a2b3;--line:#323844;--acc:#5b8cff;--accink:#0b1020;--field:#262b34;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--panel:#1d2128;--ink:#e8ebf0;--mute:#98a2b3;--line:#323844;--acc:#5b8cff;--accink:#0b1020;--field:#262b34;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif}
.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
.panel{background:var(--panel);border-right:1px solid var(--line);padding:18px;overflow:auto;position:sticky;top:0;height:100vh}
h1{font-size:17px;margin:0 0 2px}.sub{color:var(--mute);font-size:12px;margin:0 0 6px}
h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.col{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 9px;margin-bottom:7px}
.col .r1{display:flex;gap:4px;align-items:center}
input[type=text],input[type=number],input[type=date],select{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit}
.col label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-top:6px}
.col input[type=range]{flex:1;accent-color:var(--acc)}
.ib{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:6px;flex:none}
.ib:hover{color:var(--acc);background:var(--panel)}.ib.d:hover{color:#d92d20}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600;width:100%;padding:12px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid label,.lbl{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.chk{display:flex;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.chk input{accent-color:var(--acc);width:16px;height:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg label{margin:0;text-align:center;padding:9px 6px;cursor:pointer;font-size:13px;color:var(--ink);background:var(--field)}
.seg input{display:none}
.seg input:checked+span{font-weight:600}
.seg label:has(input:checked){background:var(--acc);color:var(--accink)}
.stage{padding:24px;overflow:auto}
.pages{display:flex;flex-direction:column;align-items:center;gap:22px}
.sheet{background:#fff;color:#000;box-shadow:0 2px 14px rgba(0,0,0,.18);overflow:hidden;flex:none}
.hd{display:flex;flex-direction:column;justify-content:center;padding-bottom:2mm}
.co{font-size:20pt;font-weight:700;text-align:center;line-height:1.2}
.meta{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5pt;margin-top:2.5mm;gap:10px}
.meta .t{font-weight:600;font-size:12pt}
.meta .dt{font-weight:700}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:var(--bw,1px) solid #000;padding:0 5px;text-align:left;vertical-align:middle;overflow:hidden;font-size:var(--fs,11pt)}
th{font-weight:700;text-align:center}
.shade th{background:#e9ecef}
td.n{text-align:center;color:#444}
@media (max-width:860px){.app{grid-template-columns:1fr}.panel{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.stage{padding:12px}}
@media print{
 html,body{background:#fff!important}:root{padding:0}
 .panel{display:none!important}.app{display:block}.stage{padding:0;overflow:visible}
 .pages{zoom:1!important;display:block;gap:0}
 .sheet{box-shadow:none;page-break-after:always;break-after:page}
 .sheet:last-child{page-break-after:auto;break-after:auto}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
 <aside class="panel">
  <h1>Print Sheet Maker</h1>
  <p class="sub">A4 print-ready table · column barao/komao, tarpor print koro</p>

  <h2>Orientation</h2>
  <div class="seg">
   <label><input type="radio" name="or" value="portrait"><span>▯ Portrait</span></label>
   <label><input type="radio" name="or" value="landscape"><span>▭ Landscape</span></label>
  </div>

  <h2>Header</h2>
  <label class="chk"><input type="checkbox" id="showHeader"> Show header</label>
  <label class="lbl" for="company">Company name</label>
  <input type="text" id="company">
  <label class="lbl" for="title" style="margin-top:8px">Sheet title (optional)</label>
  <input type="text" id="title" placeholder="e.g. Store Issue Sheet">
  <label class="chk" style="margin-top:10px"><input type="checkbox" id="autoDate"> Auto date (aajker tarikh)</label>
  <div class="grid">
   <div id="manWrap"><label for="date">Custom date</label><input type="date" id="date"></div>
   <div><label for="dfmt">Date format</label><select id="dfmt"><option value="dmy">09/11/2026</option><option value="long">09 Nov 2026</option></select></div>
  </div>

  <h2>Columns</h2>
  <label class="lbl" for="preset">Quick preset</label>
  <select id="preset" style="margin-bottom:10px"><option value="">Choose…</option><option value="issue">Store issue sheet (8 columns)</option><option value="loc">Item location (Item, Qty, Shelf, Row)</option></select>
  <div id="cols"></div>
  <button class="btn" id="add" style="width:100%">+ Add column</button>

  <h2>Page</h2>
  <div class="grid">
   <div><label for="rows">Rows per page</label><input type="number" id="rows" min="1" max="60"></div>
   <div><label for="pages">Pages</label><input type="number" id="pages" min="1" max="20"></div>
   <div><label for="margin">Margin (mm)</label><input type="number" id="margin" min="0" max="30"></div>
   <div><label for="fs">Text size</label><select id="fs"><option value="9.5">Small</option><option value="11">Medium</option><option value="12.5">Large</option></select></div>
   <div><label for="bw">Line thickness</label><select id="bw"><option value="0.5">Thin</option><option value="1">Normal</option><option value="2">Bold</option></select></div>
  </div>
  <label class="chk"><input type="checkbox" id="serial"> Serial number column (#)</label>
  <label class="chk"><input type="checkbox" id="shade"> Shaded table header</label>
  <label class="chk"><input type="checkbox" id="showPage"> Page number (multi-page)</label>

  <div style="margin-top:20px;display:grid;gap:8px">
   <button class="btn pri" id="print">🖨 Print (A4)</button>
   <button class="btn" id="reset">Reset to default</button>
  </div>
  <p class="sub" style="margin-top:12px">Orientation auto set hoye jabe. Print dialog e <b>Margins: None</b> ar <b>Scale: 100%</b> rakhle sundor fit hobe.</p>
 </aside>
 <main class="stage"><div class="pages" id="pagesEl"></div></main>
</div>
<script>
const PRE={
 issue:[["Item name",22],["Unit",7],["Qty",7],["Department",12],["Area of Use",12],["Old item",9],["Receiver Name",15],["Signature",16]],
 loc:[["Item name",40],["Quantity",30],["Shelf",15],["Row",15]]
};
const mk=a=>a.map(x=>({n:x[0],w:x[1]}));
const DEF={cols:mk(PRE.issue),rows:15,pages:1,margin:8,bw:"1",fs:"11",serial:false,shade:true,showHeader:true,company:"Borak Pulp and Paper Mills Limited",title:"",autoDate:true,date:"",dfmt:"dmy",orient:"landscape",showPage:true};
const clone=o=>JSON.parse(JSON.stringify(o));
let S=clone(DEF);
try{const t=localStorage.getItem("psm2");if(t)S=Object.assign({},DEF,JSON.parse(t))}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function save(){try{localStorage.setItem("psm2",JSON.stringify(S))}catch(e){}}
function dateText(){
 let d=new Date();
 if(!S.autoDate&&S.date){const p=S.date.split("-");if(p.length===3)d=new Date(+p[0],+p[1]-1,+p[2])}
 if(!S.autoDate&&!S.date)return "";
 if(S.dfmt==="long")return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
 const z=n=>String(n).padStart(2,"0");return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear();
}
function buildCols(){
 $("cols").innerHTML=S.cols.map((c,i)=>`<div class="col"><div class="r1"><input type="text" data-i="${i}" data-k="n" value="${esc(c.n)}" placeholder="Column name"><button class="ib" data-up="${i}" title="Move up">▲</button><button class="ib" data-dn="${i}" title="Move down">▼</button><button class="ib d" data-del="${i}" title="Remove">✕</button></div><label>Width <input type="range" min="4" max="60" value="${c.w}" data-i="${i}" data-k="w"><span id="wv${i}">${c.w}</span></label></div>`).join("");
}
function sheets(){
 const L=S.orient==="landscape",W=L?297:210,H=L?209:296,m=+S.margin||0,dt=dateText(),hH=S.showHeader?22:((dt||(S.showPage&&S.pages>1))?9:0);
 $("pageStyle").textContent="@page{size:A4 "+S.orient+";margin:0}";
 const th=H-2*m-hH;
 const cols=[];if(S.serial)cols.push({n:"#",w:4,s:1});S.cols.forEach(c=>cols.push(c));
 const tot=cols.reduce((a,c)=>a+(+c.w),0)||1;
 const cg=cols.map(c=>`<col style="width:${(c.w/tot*100).toFixed(3)}%">`).join("");
 let html="",k=0;
 for(let p=1;p<=S.pages;p++){
  let meta=(dt?"Date: "+esc(dt):"")+(S.showPage&&S.pages>1?(dt?" · ":"")+"Page "+p+"/"+S.pages:"");
  const mt=`<div class="meta"${S.showHeader?"":' style="margin-top:0"'}><span class="t">${esc(S.title)}</span><span class="dt">${meta}</span></div>`;const hd=S.showHeader?`<div class="hd" style="height:${hH}mm"><div class="co">${esc(S.company)}</div>${mt}</div>`:(hH?`<div class="hd" style="height:${hH}mm;justify-content:flex-start">${mt}</div>`:"");
  const head=cols.map(c=>`<th>${esc(c.n)}</th>`).join("");
  let body="";
  for(let r=0;r<S.rows;r++){k++;body+="<tr>"+cols.map(c=>c.s?`<td class="n">${k}</td>`:"<td></td>").join("")+"</tr>"}
  html+=`<section class="sheet" style="width:${W}mm;height:${H}mm;padding:${m}mm;--bw:${S.bw}px;--fs:${S.fs}pt">${hd}<table class="${S.shade?"shade":""}" style="height:${th}mm"><colgroup>${cg}</colgroup><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></section>`;
 }
 $("pagesEl").innerHTML=html;fit();
}
function fit(){
 const el=$("pagesEl");el.style.zoom=1;
 const avail=el.parentElement.clientWidth-(window.innerWidth<=860?24:48),w=(S.orient==="landscape"?297:210)*3.7795;
 if(avail<w)el.style.zoom=Math.max(.3,avail/w);
}
function sync(){
 ["rows","pages","margin","bw","fs","company","title","date","dfmt"].forEach(k=>$(k).value=S[k]);
 ["serial","shade","showHeader","autoDate","showPage"].forEach(k=>$(k).checked=S[k]);
 document.querySelectorAll('input[name=or]').forEach(r=>r.checked=r.value===S.orient);
 $("manWrap").style.opacity=S.autoDate?.45:1;$("date").disabled=S.autoDate;
}
$("cols").addEventListener("input",e=>{
 const t=e.target,i=+t.dataset.i,k=t.dataset.k;if(isNaN(i))return;
 S.cols[i][k]=k==="w"?+t.value:t.value;
 if(k==="w")$("wv"+i).textContent=t.value;
 save();sheets();
});
$("cols").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 const d=b.dataset;
 if(d.del!==undefined){if(S.cols.length<=1)return;S.cols.splice(+d.del,1)}
 else if(d.up!==undefined){const i=+d.up;if(i<1)return;[S.cols[i-1],S.cols[i]]=[S.cols[i],S.cols[i-1]]}
 else if(d.dn!==undefined){const i=+d.dn;if(i>=S.cols.length-1)return;[S.cols[i+1],S.cols[i]]=[S.cols[i],S.cols[i+1]]}
 else return;
 buildCols();save();sheets();
});
$("add").onclick=()=>{S.cols.push({n:"Column "+(S.cols.length+1),w:12});buildCols();save();sheets()};
$("preset").onchange=e=>{const v=e.target.value;if(!PRE[v])return;S.cols=mk(PRE[v]);e.target.value="";buildCols();save();sheets()};
const num=(id,key,min,max)=>$(id).addEventListener("input",e=>{let v=parseFloat(e.target.value);if(isNaN(v))return;S[key]=Math.min(max,Math.max(min,v));save();sheets()});
num("rows","rows",1,60);num("pages","pages",1,20);num("margin","margin",0,30);
["bw","fs","dfmt"].forEach(k=>$(k).onchange=e=>{S[k]=e.target.value;save();sheets()});
["serial","shade","showHeader","showPage"].forEach(k=>$(k).onchange=e=>{S[k]=e.target.checked;save();sheets()});
$("autoDate").onchange=e=>{S.autoDate=e.target.checked;save();sync();sheets()};
["company","title","date"].forEach(k=>$(k).oninput=e=>{S[k]=e.target.value;save();sheets()});
document.querySelectorAll('input[name=or]').forEach(r=>r.onchange=e=>{S.orient=e.target.value;save();sheets()});
$("print").onclick=()=>{sheets();window.print()};
window.addEventListener("beforeprint",sheets);
$("reset").onclick=()=>{S=clone(DEF);save();sync();buildCols();sheets()};
window.addEventListener("resize",fit);
sync();buildCols();sheets();
</script>
</body>
</html>
